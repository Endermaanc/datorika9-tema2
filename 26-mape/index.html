<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Gun 4D</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #e2a2a2;
  color: #000000;
}

h1 {
  color: #ff0000;
  font-size: 36px;
  text-align: center;
}

.noteikumi {
  background-color: #e9ac03;
  color: #222222;
  padding: 16px;
  border-radius: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 2px solid #ff0000;
  background-color: #f8fafc;
  box-sizing: border-box;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 100%;
  text-align: center;
}

button {
  background-color: #ff0000;
  color: #000000;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>Pixel Gun 4D</h1>
<p>Iegūt 30 punktus lai uzvarētu.</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Nogalini pretinieku lai iegūtu 1 punktu.</p>
  <p>Skaņas poga atskaņo punkta iegūšanas skaņu.</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/varonis.png" alt="Sarkanais vīriņš ar melniem cimdiem" width="128">
  <p>Punktu iegūšanas skaņa:</p>
  <audio controls src="skanas/punkta_iegūšana.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
