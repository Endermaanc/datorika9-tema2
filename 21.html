<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #f1f5f9 ; color: #222222; }
h1 { color: #d40e0e; }
.noteikumi { background-color: #6c94df; padding: 12px; border-radius: 12px;  }
button { background-color: #f70303; color: #fcfbfb; border: 0; border-radius: 12px; }
</style>
</head>
<body>
<h1>Pixel Gun 4D</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Iegūsti 30 punktus.</p>
</section>
<section class="vadība">
  <h3>Vadība</h3>
  <ul>
    <li>WASD lai kustētos.</li>
    <li>Space lai lektu.</li>
    <li>Kreisais klikšķis lai šautu.</li>
    <li>Shift lai skrietu.</li>
  </ul>
</section>
<button>Sākt spēli</button>
</body>
</html>
